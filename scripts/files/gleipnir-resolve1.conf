<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Gleipnir: the claude user can't ask systemd-resolved to look names up over D-Bus
  (e.g. resolvectl query), which would get round Gjöll's DNS block. Its other way in,
  the socket in /run/systemd/resolve, is closed to claude by an ACL (08-claude.sh).
  Installed only when claude.network is "allowlist".
-->
<busconfig>
  <policy user="claude">
    <deny send_destination="org.freedesktop.resolve1"/>
  </policy>
</busconfig>