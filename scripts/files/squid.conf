# Managed by Gleipnir: Gjöll's proxy. Changes here are replaced on every provision;
# set the allowed sites with claude.allowed_domains (and runner.allowed_domains).
#
# The claude and runner users have no other way out: Gjöll blocks their direct
# connections and DNS, and lets each reach only its own port here. Every
# connection is checked by name twice:
#
#   1. the outer port checks the name the tool asks for (CONNECT), and refuses
#      anything not listed with a plain 403, without looking the name up;
#   2. the inner port, which only Squid itself can reach, reads the name in the
#      encrypted connection's hello (SNI) and cuts the connection if that isn't
#      listed either.
#
# Most sites are never decrypted: the hello is read ("peeked"), then the bytes are
# passed through ("spliced"). The package sites (npm, and Composer's when PHP is set up)
# are the exception: they're decrypted, so each request can be checked, and only
# downloads are let through. Uploads, like publishing a package or creating a gist,
# are refused. Anthropic's sites are never decrypted.
#
# Two ports per user because Squid can't refuse with a plain 403 on a port that reads
# hellos: it answers OK, then shows its error page over TLS.

# --- The ports: outer (users connect here), inner (only Squid connects here) -----------
http_port 127.0.0.1:3128 name=claude
http_port 127.0.0.1:3129 name=runner
# The inner ports' certificate authority is Gleipnir's own, made for this machine. Squid
# uses it only for the package sites, and only the tools Claude runs trust it.
http_port 127.0.0.1:3138 name=claude_tls ssl-bump tls-cert=/etc/squid/gleipnir/ca.pem generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
http_port 127.0.0.1:3139 name=runner_tls ssl-bump tls-cert=/etc/squid/gleipnir/ca.pem generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
# Makes the package sites' certificates, signed by that authority, and keeps them on disk
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB
sslcrtd_children 5 startup=1 idle=1

acl claude_port myportname claude
acl runner_port myportname runner
acl claude_tls_port myportname claude_tls
acl runner_tls_port myportname runner_tls
acl from_loopback src 127.0.0.1/32

# --- Check 1: what may be asked for ------------------------------------------------------
# -n: never look a name up to decide, and never reverse-look-up an address
acl CONNECT method CONNECT
acl https_port port 443
acl claude_sites dstdomain -n "/etc/squid/gleipnir/claude-domains"
acl runner_sites dstdomain -n "/etc/squid/gleipnir/runner-domains"

# --- Inside a decrypted package site: downloads only ----------------------------------------
acl package_sites dstdomain -n "/etc/squid/gleipnir/package-domains"
acl download method GET HEAD
acl POST method POST
# GitHub's API: only the addresses Composer downloads packages from,
# /repos/<owner>/<repo>/zipball/<version> (or tarball)
acl github_api dstdomain -n api.github.com
acl github_archive urlpath_regex ^/repos/[A-Za-z0-9-]+/[A-Za-z0-9_.-]+/(zip|tar)ball/[A-Za-z0-9_.-]+$
# Addresses that step back up a folder (".."), which a server might read as a different
# address from the one checked here. (GitHub's rule above also rules out encoded ones, like
# "%2e%2e"; npm needs "%" for scoped packages, such as @sveltejs%2fkit.)
acl odd_path urlpath_regex (^|/)\.\.?(/|$)
# A download carrying a body
acl body_length req_header Content-Length [1-9]
acl body_chunked req_header Transfer-Encoding .
# A request that arrived inside an encrypted connection the proxy decrypted
acl decrypted connections_encrypted
# The only uploads: npm's and Packagist's security checks, which send a list of package
# names and versions to a service only npm or Packagist can read. (Composer's report of
# what it installed is refused; Composer carries on without it.)
acl npm_registry dstdomain -n registry.npmjs.org
acl npm_audit urlpath_regex ^/-/npm/v1/security/(advisories/bulk|audits/quick)$
acl packagist dstdomain -n packagist.org
acl packagist_audit urlpath_regex ^/api/security-advisories/$

# Only port 443. On the inner ports, requests that aren't CONNECT come from inside a
# decrypted package site, and each one must be a download (or one of the checks above).
# Inside one, a CONNECT is refused outright: Squid would pass whatever followed it
# straight through, unchecked.
http_access deny !https_port
http_access deny CONNECT decrypted
http_access deny decrypted odd_path
http_access deny download body_length
http_access deny download body_chunked
http_access allow claude_tls_port from_loopback claude_sites package_sites download !github_api
http_access allow claude_tls_port from_loopback claude_sites github_api download github_archive
http_access allow claude_tls_port from_loopback claude_sites npm_registry POST npm_audit
http_access allow claude_tls_port from_loopback claude_sites packagist POST packagist_audit
http_access allow runner_tls_port from_loopback runner_sites package_sites download !github_api
http_access allow runner_tls_port from_loopback runner_sites github_api download github_archive
http_access allow runner_tls_port from_loopback runner_sites npm_registry POST npm_audit
http_access allow runner_tls_port from_loopback runner_sites packagist POST packagist_audit

# Everything else must be an encrypted connection (CONNECT) to a listed name.
# The inner ports check the same again; only Squid's own outer ports can reach them.
http_access deny !CONNECT
http_access allow claude_port claude_sites
http_access allow runner_port runner_sites
http_access allow claude_tls_port from_loopback claude_sites
http_access allow runner_tls_port from_loopback runner_sites
http_access deny all

# --- Outer to inner ------------------------------------------------------------------------
cache_peer 127.0.0.1 parent 3138 0 no-query no-digest no-netdb-exchange name=claude_inner
cache_peer 127.0.0.1 parent 3139 0 no-query no-digest no-netdb-exchange name=runner_inner
cache_peer_access claude_inner allow claude_port
cache_peer_access claude_inner deny all
cache_peer_access runner_inner allow runner_port
cache_peer_access runner_inner deny all
never_direct allow claude_port
never_direct allow runner_port
always_direct allow claude_tls_port
always_direct allow runner_tls_port

# --- Check 2: the name in the hello ---------------------------------------------------------
# --client-requested: the name the tool put in its hello. A hello with no name is judged by
# the name asked for in step 1 instead, which only reaches that site's own address anyway.
acl step1 at_step SslBump1
acl claude_hello ssl::server_name --client-requested "/etc/squid/gleipnir/claude-domains"
acl runner_hello ssl::server_name --client-requested "/etc/squid/gleipnir/runner-domains"
acl package_hello ssl::server_name --client-requested "/etc/squid/gleipnir/package-domains"

# Read the hello. Then: a package site, both by the name asked for and by the name in the
# hello, is decrypted; any other listed site, by both names, is passed through; everything
# else is cut, including a mix of the two (asking for npm but naming another site in the
# hello, or the reverse), which could otherwise reach a package site without decryption.
ssl_bump peek step1
ssl_bump bump claude_tls_port claude_hello package_hello package_sites
ssl_bump bump runner_tls_port runner_hello package_hello package_sites
ssl_bump splice claude_tls_port claude_hello !package_hello !package_sites
ssl_bump splice runner_tls_port runner_hello !package_hello !package_sites
ssl_bump terminate all

# Decrypted sites must prove who they are with a certificate the machine trusts, as usual
sslproxy_cert_error deny all

# --- A proxy, not a cache, and as quiet about the user as possible -------------------------
cache_effective_user proxy
pinger_enable off
cache deny all
cache_mem 8 MB
via off
forwarded_for delete
httpd_suppress_version_string on

# --- The log: one line per connection, check and decrypted request, read by gjoll-log -------
# time, port, method, the name or address asked for, the name in the hello, status, result.
# The hello's name is whatever the tool sent, so it's URL-encoded: it can't add lines to the log.
logformat gleipnir %ts %>lp %rm %ru %#ssl::>sni %>Hs %Ss
access_log /var/log/squid/access.log gleipnir
# Ubuntu rotates the logs with logrotate, which then tells Squid to reopen them; Squid
# mustn't rename them as well
logfile_rotate 0
coredump_dir none
shutdown_lifetime 2 seconds